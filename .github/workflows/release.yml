name: Publish npm release

# "published" covers stable releases AND prereleases, but never drafts.
# Requires npm Trusted Publishing (OIDC) configured on npmjs.com for
# @dantehemerson/react-body-shape: repository dantehemerson/body-shape,
# workflow .github/workflows/release.yml, environment left empty.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11
      - name: Validate version and release channel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: npm run release:validate
      - run: npm ci
      - run: npm run check
      - name: Pack and test the actual release artifact
        run: |
          npm pack --ignore-scripts
          node scripts/smoke-package.mjs dantehemerson-react-body-shape-*.tgz
      - name: Preserve release artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ steps.release.outputs.version }}
          path: '*.tgz'
          if-no-files-found: error
      - name: Publish to the correct npm channel
        env:
          # Auth via npm Trusted Publishing (OIDC): the job's id-token: write
          # permission lets npm@11 exchange the GitHub Actions identity for a
          # short-lived publish token. No repository secret is involved.
          NPM_CHANNEL: ${{ steps.release.outputs.npm_tag }}
        run: npm publish dantehemerson-react-body-shape-*.tgz --access public --provenance --tag "$NPM_CHANNEL"
